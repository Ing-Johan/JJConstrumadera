{% extends 'base.html' %}

{% block title %}{{ site_name }} | {{ title }}{% endblock %}

{% block content %}
<section class="section owner-dashboard-shell">
  <div class="container small-container">
    <div class="page-header owner-header">
      <div>
        <p class="eyebrow">Galería</p>
        <h1>{{ title }}</h1>
      </div>
      <a href="{% url 'owner_portfolio_images' project.id %}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="panel-card">
      {% if image.image %}
        <img src="{{ image.image.url }}" alt="{{ image.caption|default:project.name }}" class="owner-thumb" />
      {% endif %}
      <form method="post" enctype="multipart/form-data" class="owner-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
